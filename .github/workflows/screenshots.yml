name: Update screenshots

# Regenerates the screenshots (user journeys and/or store screenshots) with the same script you run
# locally (e2e/scripts/update-screenshots.sh) and commits them under docs/screenshots/ to the branch you run it on.
# Run on main (protected: changes only via PR), it opens a PR from a new screenshots/<date>-<run> branch instead.
on:
  workflow_dispatch:
    inputs:
      which:
        description: Which screenshots
        type: choice
        options: [all, journeys, store]
        default: all
      commit:
        description: Commit the new screenshots (otherwise only a downloadable artifact)
        type: boolean
        default: true

concurrency:
  group: screenshots-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  screenshots:
    name: Update screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-e2e

      - name: Regenerate screenshots
        env:
          CI: 'true'
        run: e2e/scripts/update-screenshots.sh --skip-build --only=${{ inputs.which }}

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: docs/screenshots/
          retention-days: 30

      - name: Commit the screenshots
        if: ${{ inputs.commit }}
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [[ -z "$(git status --porcelain -- docs/screenshots)" ]]; then
            echo "Screenshots unchanged, nothing to commit." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A docs/screenshots
          git commit -m "Update screenshots (${{ inputs.which }})"

          if [[ "$BRANCH" != "$DEFAULT_BRANCH" ]]; then
            # Commit straight onto the branch the run was started on (fails if someone pushed meanwhile: just re-run).
            git push origin "HEAD:refs/heads/$BRANCH"
            target="$BRANCH"
            echo "Committed to \`$BRANCH\`." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            # main only takes changes through a PR: put the commit on a new branch and open one.
            target="screenshots/$(date -u +%Y-%m-%d)-${GITHUB_RUN_ID}"
            git push origin "HEAD:refs/heads/$target"
            title="Update screenshots ($(date -u +%Y-%m-%d), ${{ inputs.which }})"
            body="Screenshots regenerated by the [Update screenshots run](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})."
            if url="$(gh pr create --base "$BRANCH" --head "$target" --title "$title" --body "$body")"; then
              echo "Opened $url" | tee -a "$GITHUB_STEP_SUMMARY"
            else
              # Needs Settings > Actions > General > "Allow GitHub Actions to create and approve pull requests".
              echo "Could not open the PR automatically. Open it here: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/${BRANCH}...${target}?expand=1" | tee -a "$GITHUB_STEP_SUMMARY"
            fi
          fi

          # Pushes made with GITHUB_TOKEN don't trigger other workflows, so start the required e2e check on the
          # new commit explicitly (workflow_dispatch is the allowed exception).
          gh workflow run e2e.yml --ref "$target"
