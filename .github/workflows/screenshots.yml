name: Update screenshots

# Regenerates the screenshots (user journeys and/or store screenshots) with the same script you run
# locally (e2e/scripts/update-screenshots.sh) and opens a PR with the result under docs/screenshots/.
on:
  workflow_dispatch:
    inputs:
      which:
        description: Which screenshots
        type: choice
        options: [all, journeys, store]
        default: all
      open_pr:
        description: Open a PR with the new screenshots (otherwise only a downloadable artifact)
        type: boolean
        default: true

concurrency:
  group: screenshots-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  screenshots:
    name: Update screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-e2e

      - name: Regenerate screenshots
        env:
          CI: 'true'
        run: e2e/scripts/update-screenshots.sh --skip-build --only=${{ inputs.which }}

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: docs/screenshots/
          retention-days: 30

      - name: Commit to a branch and open a PR
        if: ${{ inputs.open_pr }}
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.ref_name }}
        run: |
          if [[ -z "$(git status --porcelain -- docs/screenshots)" ]]; then
            echo "Screenshots unchanged, nothing to commit." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          branch="screenshots/$(date -u +%Y-%m-%d)-${GITHUB_RUN_ID}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$branch"
          git add -A docs/screenshots
          git commit -m "Update screenshots (${{ inputs.which }})"
          git push -u origin "$branch"

          title="Update screenshots ($(date -u +%Y-%m-%d), ${{ inputs.which }})"
          body="Screenshots regenerated by the [Update screenshots run](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})."
          if url="$(gh pr create --base "$BASE" --head "$branch" --title "$title" --body "$body")"; then
            echo "Opened $url" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            # Needs Settings > Actions > General > "Allow GitHub Actions to create and approve pull requests".
            echo "Could not open the PR automatically. Open it here: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/${BASE}...${branch}?expand=1" | tee -a "$GITHUB_STEP_SUMMARY"
          fi

          # Pushes made with GITHUB_TOKEN don't trigger other workflows, so start the required e2e check
          # on the new branch explicitly (workflow_dispatch is the allowed exception).
          gh workflow run e2e.yml --ref "$branch"
