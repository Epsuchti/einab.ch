name: E2E tests

# Runs the Playwright user journeys (e2e/tests) against a fresh test server:
# in-memory H2, demo login on, every outbound channel off. No secrets needed.
on:
  pull_request:
  push:
    branches: [main]
  # Also lets the screenshot workflow start the check on the branch it opens a PR for.
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    # This job's name is the required status check on main.
    name: Playwright e2e
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-e2e

      - name: Run Playwright journeys
        working-directory: e2e
        env:
          CI: 'true'
          E2E_SKIP_SERVER_BUILD: 'true'
        run: npx playwright test

      - name: Upload report and screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            e2e/playwright-report/
            e2e/screenshots/
            e2e/test-results/
          retention-days: 14
