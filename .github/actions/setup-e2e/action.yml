name: Set up e2e
description: >
  Java 21, Node 24 and caches, builds the server jar (with the bundled Angular client) once,
  installs the e2e dependencies and Chromium. The tests then reuse the jar (E2E_SKIP_SERVER_BUILD=true).
runs:
  using: composite
  steps:
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '21'
        cache: maven
        cache-dependency-path: server/pom.xml

    - uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: npm
        cache-dependency-path: |
          e2e/package-lock.json
          client/package-lock.json

    # frontend-maven-plugin downloads its own Node into client/node; keep it between runs.
    - uses: actions/cache@v4
      with:
        path: client/node
        key: frontend-node-${{ runner.os }}-${{ hashFiles('server/pom.xml') }}

    - name: Build server jar (includes the Angular client)
      shell: bash
      working-directory: server
      run: ./mvnw -B -ntp -DskipTests package

    - name: Install e2e dependencies
      shell: bash
      working-directory: e2e
      run: |
        npm ci
        npx playwright install --with-deps chromium
