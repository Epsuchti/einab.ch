databaseChangeLog:
  - changeSet:
      id: 024-add-pickup-extra-slots
      author: claude
      changes:
        - createTable:
            tableName: foodsharing_pickup_extra_slots
            columns:
              - column: {name: id, type: UUID, constraints: {primaryKey: true, nullable: false}}
              - column: {name: version, type: BIGINT, defaultValueNumeric: 0, constraints: {nullable: false}}
              - column: {name: created_at, type: TIMESTAMP WITH TIME ZONE, constraints: {nullable: false}}
              - column: {name: updated_at, type: TIMESTAMP WITH TIME ZONE, constraints: {nullable: false}}
              - column: {name: admin_connection_id, type: UUID}
              - column: {name: store_id, type: BIGINT, constraints: {nullable: false}}
              - column: {name: pickup_date, type: TIMESTAMP WITH TIME ZONE, constraints: {nullable: false}}
              - column: {name: foodsharing_user_id, type: VARCHAR(100), constraints: {nullable: false}}
              - column: {name: foodsharing_user_name, type: VARCHAR(255)}
              - column: {name: previous_total_slots, type: INT, constraints: {nullable: false}}
              - column: {name: new_total_slots, type: INT, constraints: {nullable: false}}
        - addUniqueConstraint:
            tableName: foodsharing_pickup_extra_slots
            columnNames: store_id, pickup_date
            constraintName: uk_foodsharing_pickup_extra_slots_store_pickup
        - addForeignKeyConstraint:
            baseTableName: foodsharing_pickup_extra_slots
            baseColumnNames: admin_connection_id
            referencedTableName: foodsharing_admin_connections
            referencedColumnNames: id
            constraintName: fk_foodsharing_pickup_extra_slots_connection
            onDelete: SET NULL
