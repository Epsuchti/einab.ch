databaseChangeLog:
  - changeSet:
      id: 044-pickup-history-cache
      author: claude
      changes:
        # Past pickups per store for the linked-store rule; only the days since fetched_until are read again.
        - createTable:
            tableName: foodsharing_store_pickup_history_cache
            columns:
              - column: {name: id, type: UUID, constraints: {primaryKey: true, nullable: false}}
              - column: {name: version, type: BIGINT, defaultValueNumeric: 0, constraints: {nullable: false}}
              - column: {name: created_at, type: TIMESTAMP WITH TIME ZONE, constraints: {nullable: false}}
              - column: {name: updated_at, type: TIMESTAMP WITH TIME ZONE, constraints: {nullable: false}}
              - column: {name: admin_connection_id, type: UUID, constraints: {nullable: false}}
              - column: {name: store_id, type: BIGINT, constraints: {nullable: false}}
              - column: {name: fetched_until, type: TIMESTAMP WITH TIME ZONE, constraints: {nullable: false}}
              - column: {name: valid_until, type: TIMESTAMP WITH TIME ZONE, constraints: {nullable: false}}
              - column: {name: payload_json, type: TEXT, constraints: {nullable: false}}
        - addForeignKeyConstraint:
            baseTableName: foodsharing_store_pickup_history_cache
            baseColumnNames: admin_connection_id
            referencedTableName: foodsharing_admin_connections
            referencedColumnNames: id
            constraintName: fk_foodsharing_store_pickup_history_cache_connection
            onDelete: CASCADE
        - addUniqueConstraint:
            tableName: foodsharing_store_pickup_history_cache
            columnNames: admin_connection_id, store_id
            constraintName: uk_foodsharing_store_pickup_history_cache_connection_store
