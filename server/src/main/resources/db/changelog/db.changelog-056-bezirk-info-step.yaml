databaseChangeLog:
  - changeSet:
      id: 056-bezirk-info-step
      author: claude
      changes:
        # Optional info page per Bezirk (Markdown), shown as second onboarding step after the privacy consent.
        # VARCHAR(1000000) instead of TEXT/CLOB: effectively unlimited, and the same type works on H2 and PostgreSQL.
        - addColumn:
            tableName: bezirke
            columns:
              - column:
                  name: info_step_enabled
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: info_markdown
                  type: VARCHAR(1000000)
        # The Bezirk whose info page the user has read; the step comes back when the user moves to another Bezirk.
        - addColumn:
            tableName: users
            columns:
              - column:
                  name: bezirk_info_seen_bezirk_id
                  type: UUID
              - column:
                  name: bezirk_info_seen_at
                  type: TIMESTAMP WITH TIME ZONE
