databaseChangeLog:
  - changeSet:
      id: 047-store-info-pickup-snapshots
      author: claude
      changes:
        # Slot count and occupancy of upcoming pickups, recorded on each daily Bieb Store Info check.
        - createTable:
            tableName: foodsharing_store_info_pickup_snapshots
            columns:
              - column: {name: id, type: UUID, constraints: {primaryKey: true, nullable: false}}
              - column: {name: version, type: BIGINT, defaultValueNumeric: 0, constraints: {nullable: false}}
              - column: {name: created_at, type: TIMESTAMP WITH TIME ZONE, constraints: {nullable: false}}
              - column: {name: updated_at, type: TIMESTAMP WITH TIME ZONE, constraints: {nullable: false}}
              - column: {name: admin_connection_id, type: UUID, constraints: {nullable: false}}
              - column: {name: store_id, type: BIGINT, constraints: {nullable: false}}
              - column: {name: pickup_date, type: TIMESTAMP WITH TIME ZONE, constraints: {nullable: false}}
              - column: {name: total_slots, type: INT, constraints: {nullable: false}}
              - column: {name: occupied_slots, type: INT, constraints: {nullable: false}}
              - column: {name: checked_at, type: TIMESTAMP WITH TIME ZONE, constraints: {nullable: false}}
        - addForeignKeyConstraint:
            baseTableName: foodsharing_store_info_pickup_snapshots
            baseColumnNames: admin_connection_id
            referencedTableName: foodsharing_admin_connections
            referencedColumnNames: id
            constraintName: fk_foodsharing_store_info_pickup_snapshots_connection
            onDelete: CASCADE
        - addUniqueConstraint:
            tableName: foodsharing_store_info_pickup_snapshots
            columnNames: admin_connection_id, store_id, pickup_date
            constraintName: uk_foodsharing_store_info_pickup_snapshots_pickup
