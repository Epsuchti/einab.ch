databaseChangeLog:
  - changeSet:
      id: 018-add-private-info-templates
      author: codex
      changes:
        - createTable:
            tableName: private_info_templates
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: version
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: teacher_id
                  type: UUID
                  constraints:
                    nullable: false
                    foreignKeyName: fk_private_info_template_teacher
                    references: users(id)
              - column:
                  name: category
                  type: VARCHAR(32)
                  constraints:
                    nullable: false
              - column:
                  name: content
                  type: VARCHAR(4000)
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            tableName: private_info_templates
            columnNames: teacher_id, category
            constraintName: uk_private_info_template_teacher_category
