spring.application.name=foodsharing-einab-tabelle
spring.datasource.url=jdbc:h2:file:./data/foodsharing;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.h2.console.enabled=false
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.endpoint.health.group.version.include=appVersion
management.endpoint.health.group.version.show-details=always

server.forward-headers-strategy=framework
server.tomcat.threads.max=50

app.auth.token-validity-days=365
app.auth.login-token-validity-minutes=30
# One-tap demo accounts for app testers (test server only, see DemoLoginService; refused in prod).
app.auth.demo-login.enabled=${DEMO_LOGIN_ENABLED:false}
app.auth.demo-login.bezirk-slug=${DEMO_LOGIN_BEZIRK:zuerich}
# Testers type this Foodsharing ID into the login field and get a new demo account (instead of a login link).
app.auth.demo-login.shared-foodsharing-id=${DEMO_LOGIN_SHARED_FOODSHARING_ID:1308}
app.frontend.base-url=${APP_FRONTEND_BASE_URL:http://localhost:4200}
app.mail.from=${MAIL_FROM:noreply@foodsharing.network}
app.foodsharing.base-url=${FOODSHARING_BASE_URL:https://foodsharing.network}
app.foodsharing.admin-user=${FOODSHARING_ADMIN_USER:}
app.foodsharing.admin-password=${FOODSHARING_ADMIN_PASSWORD:}
app.foodsharing.token-encryption-key=${FOODSHARING_TOKEN_ENCRYPTION_KEY:}
app.foodsharing.phone-number-api-base-url=${FOODSHARING_PHONE_NUMBER_API_BASE_URL:https://www.vserverli.de/fs}
app.foodsharing.phone-number-api-token=${FOODSHARING_PHONE_NUMBER_API_TOKEN:}
app.foodsharing.send-messages=${FOODSHARING_SEND_MESSAGES:true}
app.foodsharing.automation.enabled=true
app.foodsharing.automation.dry-run=true
app.foodsharing.automation.cleaning-back-check-months=12
app.foodsharing.automation.minimum-free-cleaning-slots=4
app.foodsharing.automation.poll-interval=PT10M
app.foodsharing.automation.future-pickup-cache-ttl=PT15M
app.foodsharing.automation.store-pickup-cache-ttl=PT3M
app.foodsharing.automation.store-members-cache-ttl=PT3M
app.foodsharing.automation.max-request-approvals-per-run=${AUTOMATION_MAX_REQUEST_APPROVALS_PER_RUN:50}
app.foodsharing.automation.max-advertisements-per-run=${AUTOMATION_MAX_ADVERTISEMENTS_PER_RUN:50}

spring.mail.host=${SMTP_HOST:smtp.protonmail.ch}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Outbound messages (emails, Foodsharing messages/actions that notify users, store chats, Telegram).
# Restricted by default so every non-prod server fails closed: only the listed Foodsharing users get
# messages or emails, store team chats are always blocked, and Telegram only reaches the listed chats.
# Everything else is logged as "OUTBOUND BLOCKED". Lists are comma-separated.
# Push notifications for the store app (Firebase Cloud Messaging) and app links. Push stays off without credentials.
app.push.firebase-credentials-json=${FIREBASE_CREDENTIALS_JSON:${FIREBASE_CREDENTIALS_JSON_BASE64:}}
app.push.android-package-name=${APP_ANDROID_PACKAGE_NAME:ch.einab.app}
app.push.android-sha256-fingerprints=${APP_ANDROID_SHA256_FINGERPRINTS:}
app.push.ios-app-ids=${APP_IOS_APP_IDS:}

app.outbound.restricted=${OUTBOUND_RESTRICTED:true}
app.outbound.allowed-foodsharing-ids=${OUTBOUND_ALLOWED_FOODSHARING_IDS:}
app.outbound.allowed-telegram-chat-ids=${OUTBOUND_ALLOWED_TELEGRAM_CHAT_IDS:}
