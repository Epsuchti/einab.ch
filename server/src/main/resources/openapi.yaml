  /api/admin/bezirke/{bezirkSlug}/foodsharing/automation/run:
    parameters:
      - $ref: '#/components/parameters/BezirkSlug'
    post:
      tags: [admin]
      operationId: runFoodsharingAutomation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FoodsharingRunRequest'
      responses:
        '200':
          description: Foodsharing automation run result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FoodsharingRunResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/admin/bezirke/{bezirkSlug}/foodsharing/cleaning-rule-exemptions:
    parameters:
      - $ref: '#/components/parameters/BezirkSlug'
    get:
      tags: [admin]
      operationId: getFoodsharingCleaningRuleExemptions
      responses:
        '200':
          description: Foodsharing IDs excluded from the cleaning rule
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FoodsharingCleaningRuleExemption'
        '403':
          $ref: '#/components/responses/Forbidden'
    put:
      tags: [admin]
      operationId: saveFoodsharingCleaningRuleExemption
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FoodsharingCleaningRuleExemptionRequest'
      responses:
        '200':
          description: Foodsharing cleaning-rule exemption saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FoodsharingCleaningRuleExemption'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/admin/bezirke/{bezirkSlug}/foodsharing/cleaning-rule-exemptions/{exemptionId}:
    parameters:
      - $ref: '#/components/parameters/BezirkSlug'
    delete:
      tags: [admin]
      operationId: deleteFoodsharingCleaningRuleExemption
      parameters:
        - name: exemptionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Foodsharing cleaning-rule exemption deleted
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/admin/bezirke/{bezirkSlug}/foodsharing/automation/excluded-dates:
    parameters:
      - $ref: '#/components/parameters/BezirkSlug'
    get:
      tags: [admin]
      operationId: getFoodsharingStoreAutomationExcludedDates
      responses:
        '200':
          description: Dates excluded from automatic slot approval
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FoodsharingStoreAutomationExcludedDate'
        '403':
          $ref: '#/components/responses/Forbidden'
    put:
      tags: [admin]
      operationId: saveFoodsharingStoreAutomationExcludedDate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FoodsharingStoreAutomationExcludedDateRequest'
      responses:
        '200':
          description: Excluded date saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FoodsharingStoreAutomationExcludedDate'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/admin/bezirke/{bezirkSlug}/foodsharing/automation/excluded-dates/{excludedDateId}:
    parameters:
      - $ref: '#/components/parameters/BezirkSlug'
    delete:
      tags: [admin]
      operationId: deleteFoodsharingStoreAutomationExcludedDate
      parameters:
        - name: excludedDateId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Excluded date deleted
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/admin/bezirke/{bezirkSlug}/foodsharing/automation/audit:
    parameters:
      - $ref: '#/components/parameters/BezirkSlug'
    get:
      tags: [admin]
      operationId: getFoodsharingAutomationAudit
      parameters:
        - name: onlyMine
          in: query
          schema:
            type: boolean
        - name: excludeConfirmed
          in: query
          description: Hide CONFIRMED and WOULD_CONFIRM decisions.
          schema:
            type: boolean
      responses:
        '200':
          description: Recent foodsharing automation decisions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FoodsharingAutomationAudit'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/admin/bezirke/{bezirkSlug}/foodsharing/pickup-extra-slots/audit:
    parameters:
      - $ref: '#/components/parameters/BezirkSlug'
    get:
      tags: [admin]
      operationId: getFoodsharingPickupExtraSlotAudit
      responses:
        '200':
          description: Extra slots that users added on the pickups page, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FoodsharingPickupExtraSlotAudit'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/admin/bezirke/{bezirkSlug}/foodsharing/metrics:
    parameters:
      - $ref: '#/components/parameters/BezirkSlug'
    get:
      tags: [admin]
      operationId: getFoodsharingMetrics
      parameters:
        - name: days
          in: query
          description: Length of the period in days, ending today (Europe/Zurich). Defaults to 30.
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 366
      responses:
        '200':
          description: Metrics of the automations, notifications and pickups of the Bezirk
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FoodsharingMetricsOverview'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/admin/bezirke/{bezirkSlug}/newcomer-funnel:
    get:
      tags: [admin]
      operationId: getAdminNewcomerFunnel
      parameters:
        - $ref: '#/components/parameters/BezirkSlug'
        - name: days
          in: query
          description: Only users registered in the last days. All users when omitted.
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 3660
      responses:
        '200':
          description: Newcomer funnel with the users of each step and the EinAb gaps
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NewcomerFunnelResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/admin/bezirke/{bezirkSlug}/foodsharing/future-pickup-users:
    parameters:
      - $ref: '#/components/parameters/BezirkSlug'
    get:
      tags: [admin]
      operationId: getFoodsharingFuturePickupUsers
      parameters:
        - name: forceRefresh
          in: query
          description: Bypass the cached result and reload data from Foodsharing.
          schema:
            type: boolean
      responses:
        '200':
          description: Foodsharing users with future pickups
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FoodsharingFuturePickupUser'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/surveys:
    get:
      tags: [survey]
      operationId: listMySurveys
      description: Surveys created by the current user or shared with them as co-author.
      responses:
        '200':
          description: Own surveys
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SurveyListResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [survey]
      operationId: createSurvey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SurveySaveRequest'
      responses:
        '201':
          description: Survey created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SurveyDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/surveys/coauthor-candidates:
    get:
      tags: [survey]
      operationId: listSurveyCoauthorCandidates
      description: Users that can be added as co-authors (everyone else with the survey permission).
      responses:
        '200':
          description: Possible co-authors
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SurveyCoauthorCandidatesResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/surveys/{surveyId}:
    get:
      tags: [survey]
      operationId: getMySurvey
      parameters:
        - $ref: '#/components/parameters/SurveyId'
      responses:
        '200':
          description: Survey definition (creator and co-authors)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SurveyDetail'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [survey]
      operationId: updateSurvey
      description: Questions with an id are updated in place (their answers are kept); questions that are no longer sent are deleted together with their answers. Co-authors can save too, but only the creator can change the co-authors.
      parameters:
        - $ref: '#/components/parameters/SurveyId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SurveySaveRequest'
      responses:
        '200':
          description: Survey updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SurveyDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [survey]
      operationId: deleteSurvey
      description: Deletes the survey including all questions and responses. Only the creator can delete a survey.
      parameters:
        - $ref: '#/components/parameters/SurveyId'
      responses:
        '204':
          description: Survey deleted
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/surveys/{surveyId}/results:
    get:
      tags: [survey]
      operationId: getSurveyResults
      description: All responses of a survey. Only the creator and the co-authors can read them.
      parameters:
        - $ref: '#/components/parameters/SurveyId'
      responses:
        '200':
          description: Survey results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SurveyResultsResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/surveys/{surveyId}/form:
    get:
      tags: [survey]
      operationId: getSurveyForm
      description: The survey as shown to a respondent. Any signed-in user can read it.
      parameters:
        - $ref: '#/components/parameters/SurveyId'
      responses:
        '200':
          description: Survey form
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SurveyForm'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/surveys/{surveyId}/responses:
    post:
      tags: [survey]
      operationId: submitSurveyResponse
      description: Submits the answers of the current user. Every user can answer a survey only once.
      parameters:
        - $ref: '#/components/parameters/SurveyId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SurveySubmitRequest'
      responses:
        '204':
          description: Answers saved
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

components:
  parameters:
    BezirkSlug:
      name: bezirkSlug
      in: path
      required: true
      schema:
        type: string
        pattern: '^[a-z0-9-]+$'
    SlotId:
      name: slotId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SurveyId:
      name: surveyId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    EinAbId:
      name: einAbId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TeacherId:
      name: teacherId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    BookingUserId:
      name: bookingUserId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    BadRequest:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Access denied
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    AccountDeletionRequest:
      type: object
      required: [foodsharingId]
      properties:
        foodsharingId:
          type: string
          maxLength: 100
    AccountDeletionConfirmRequest:
      type: object
      required: [token]
      properties:
        token:
          type: string
          maxLength: 200
    MessageResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string
        deliveryTarget:
          type: string
    ErrorResponse:
      type: object
      required: [message, status, code]
      properties:
        status:
          type: integer
        message:
          type: string
        code:
          $ref: '#/components/schemas/ErrorCode'
        details:
          type: array
          items:
            type: string
    ErrorCode:
      type: string
      enum: [AUTHENTICATION_REQUIRED, ACCESS_DENIED, VALIDATION_FAILED, INVALID_FOODSHARING_CREDENTIALS, FOODSHARING_ACCOUNT_LOGIN_FAILED, RESOURCE_NOT_FOUND, UNEXPECTED_ERROR, CONFLICT, PAYLOAD_TOO_LARGE, EXTERNAL_SERVICE_UNAVAILABLE, TEACHER_EMAIL_ALREADY_EXISTS, TEACHERS_CANNOT_BOOK, BEZIRK_NOT_FOUND, CATEGORY_DISABLED, USER_BEZIRK_MISMATCH, NOTIFICATION_NOT_NEEDED_VERIFIED, INVALID_LOGIN_TOKEN, LOGIN_TOKEN_EXPIRED_OR_USED, ACCOUNT_NOT_FOUND, ACCOUNT_DISABLED, INVALID_UNSUBSCRIBE_TOKEN, TEACHER_ACCOUNT_REQUIRED, TEACHER_FOODSHARING_ID_ALREADY_EXISTS, TEACHER_NOT_FOUND, TEACHER_INACTIVE, BOOKING_USER_DISABLED, BOOKING_USER_NOT_FOUND, SLOT_NOT_FOUND, BOOKING_NOT_FOUND, SLOT_NOT_AVAILABLE, USER_ALREADY_BOOKED_IN_EINAB, USER_ALREADY_BOOKED_WITH_TEACHER, USER_ALREADY_BOOKED_IN_CATEGORY, USER_BOOKING_LIMIT_REACHED, MINIMUM_PICKUP_COUNT_NOT_REACHED, FAIRTEILER_VISIT_REQUIRED_FOR_THIRD_EINAB, ONLY_OWN_BOOKINGS_CANCELLABLE, ONLY_BOOKED_APPOINTMENTS_CANCELLABLE, PAST_BOOKING_NOT_CANCELLABLE, ONLY_BOOKED_APPOINTMENTS_ASSIGNABLE, ONLY_CANCELLED_APPOINTMENTS_COUNTABLE, ONLY_COUNTED_APPOINTMENTS_NOT_COUNTABLE, ONLY_PAST_APPOINTMENTS_COUNTABLE, ASSIGNABLE_TEACHER_NOT_FOUND, EINAB_NOT_FOUND, PAST_EINAB_NOT_EDITABLE, PAST_EINAB_NOT_DELETABLE, PAST_EINAB_NOT_REASSIGNABLE, ONLY_OWN_EINABS_MANAGEABLE, SLOT_COUNT_OUT_OF_RANGE, SLOT_COUNT_REDUCTION_NOT_SUPPORTED, BOOKED_SLOTS_PREVENT_DELETE, LOCATION_REQUIRED, PUBLIC_LOCATION_REQUIRED, DEFAULT_ADMIN_CANNOT_BE_CHANGED, SURVEY_NOT_FOUND, SURVEY_ALREADY_SUBMITTED, TOO_MANY_LOGIN_REQUESTS, HISTORICAL_EINAB_MUST_BE_PAST, HISTORICAL_EINAB_TOO_OLD, HISTORICAL_EINAB_NOT_FOR_YOURSELF, TOO_MANY_SUPPORT_REQUESTS, ACCOUNT_DELETION_FUTURE_EINABS, ACCOUNT_DELETION_FOODSHARING_CONNECTED, ACCOUNT_DELETION_LINK_INVALID, BEZIRK_SLUG_TAKEN, LAST_ACTIVE_BEZIRK, ONBOARDING_REQUIRED]
    BezirkResponse:
      type: object
      required: [id, name, slug]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        disabledCategories:
          type: array
          description: Categories this Bezirk does not have; they are not offered for new EinAbs or as filters.
          items:
            $ref: '#/components/schemas/EinAbCategory'
        pickupEinAbLeadMinutes:
          type: integer
          minimum: 0
          maximum: 120
          description: EinAbs created from a teacher's pickup start this many minutes before the pickup.
        infoAvailable:
          type: boolean
          description: Whether the Bezirk has an info page (Markdown) that users can open.
    BezirkInfoResponse:
      type: object
      required: [bezirkSlug, bezirkName, markdown]
      properties:
        bezirkSlug:
          type: string
        bezirkName:
          type: string
        markdown:
          type: string
          description: Empty when the Bezirk has no info page.
    FoodsharingStatusResponse:
      type: object
      required: [online]
      properties:
        online:
          type: boolean
        offlineSince:
          type: string
          format: date-time
    BezirkListResponse:
      type: object
      required: [bezirke]
      properties:
        bezirke:
          type: array
          items:
            $ref: '#/components/schemas/BezirkResponse'
    AdminBezirkResponse:
      allOf:
        - $ref: '#/components/schemas/BezirkResponse'
        - type: object
          required: [preventDuplicateTeacherBookings, preventDuplicateCategoryBookings, maxActiveBookingsPerUser, requireFairteilerVisitByThirdEinAb, useFoodsharingUserInfoApi, foodsharingMessagingConfigured, userInfoSourceConfigured]
          properties:
            cleaningStoreId:
              type: integer
              format: int64
              nullable: true
            preventDuplicateTeacherBookings:
              type: boolean
            preventDuplicateCategoryBookings:
              type: boolean
            maxActiveBookingsPerUser:
              type: integer
              minimum: 1
            requireFairteilerVisitByThirdEinAb:
              type: boolean
            useFoodsharingUserInfoApi:
              type: boolean
            foodsharingMessagingEmail:
              type: string
              format: email
              maxLength: 255
              nullable: true
            foodsharingMessagingConfigured:
              type: boolean
            userInfoSourceConfigured:
              type: boolean
              description: Whether user info (e.g. verification dates for the cleaning rule) can be fetched for this Bezirk.
            ignoredCategories:
              type: array
              items:
                $ref: '#/components/schemas/EinAbCategory'
            infoStepEnabled:
              type: boolean
              description: Show the info page as second onboarding step, after the privacy consent.
            infoStepOnlyUnverified:
              type: boolean
              description: Show the info step only to users who are not verified on Foodsharing yet.
            infoMarkdown:
              type: string
              description: The Bezirk's info page in Markdown, German (also the fallback for the other languages).
            infoMarkdownEn:
              type: string
            infoMarkdownGws:
              type: string
    AdminBezirkSummary:
      type: object
      required: [id, name, slug, active]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        active:
          type: boolean
    AdminBezirkSummaryListResponse:
      type: object
      required: [bezirke]
      properties:
        bezirke:
          type: array
          items:
            $ref: '#/components/schemas/AdminBezirkSummary'
    BezirkDisableImpactUser:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        foodsharingId:
          type: string
          nullable: true
    BezirkDisableImpactEinAb:
      type: object
      required: [id, startDateTime, category, bookedUsers]
      properties:
        id:
          type: string
          format: uuid
        startDateTime:
          type: string
          format: date-time
        category:
          $ref: '#/components/schemas/EinAbCategory'
        businessName:
          type: string
          nullable: true
        teacherName:
          type: string
          nullable: true
        bookedUsers:
          type: array
          items:
            $ref: '#/components/schemas/BezirkDisableImpactUser'
    BezirkDisableImpactResponse:
      type: object
      required: [assignedUserCount, assignedUsers, upcomingEinAbCount, upcomingEinAbs]
      properties:
        assignedUserCount:
          type: integer
        assignedUsers:
          type: array
          items:
            $ref: '#/components/schemas/BezirkDisableImpactUser'
        upcomingEinAbCount:
          type: integer
        upcomingEinAbs:
          type: array
          items:
            $ref: '#/components/schemas/BezirkDisableImpactEinAb'
    CreateBezirkRequest:
      type: object
      required: [name, slug]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        slug:
          type: string
          minLength: 2
          maxLength: 100
          pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
    UpdateBezirkRequest:
      type: object
      properties:
        cleaningStoreId:
          type: integer
          format: int64
          minimum: 1
          nullable: true
        preventDuplicateTeacherBookings:
          type: boolean
        preventDuplicateCategoryBookings:
          type: boolean
        maxActiveBookingsPerUser:
          type: integer
          minimum: 1
        pickupEinAbLeadMinutes:
          type: integer
          minimum: 0
          maximum: 120
        infoStepEnabled:
          type: boolean
        infoStepOnlyUnverified:
          type: boolean
        infoMarkdown:
          type: string
          maxLength: 1000000
          nullable: true
        infoMarkdownEn:
          type: string
          maxLength: 1000000
          nullable: true
        infoMarkdownGws:
          type: string
          maxLength: 1000000
          nullable: true
        requireFairteilerVisitByThirdEinAb:
          type: boolean
        useFoodsharingUserInfoApi:
          type: boolean
        foodsharingMessagingEmail:
          type: string
          format: email
          maxLength: 255
          nullable: true
        foodsharingMessagingPassword:
          type: string
          format: password
          maxLength: 1024
          nullable: true
          writeOnly: true
        ignoredCategories:
          type: array
          items:
            $ref: '#/components/schemas/EinAbCategory'
        disabledCategories:
          type: array
          items:
            $ref: '#/components/schemas/EinAbCategory'
    UpdateUserBezirkRequest:
      type: object
      properties:
        bezirkSlug:
          type: string
          nullable: true
    CreateBookingUserRequest:
      type: object
      required: [foodsharingId, bezirkSlug]
      properties:
        foodsharingId:
          type: string
          minLength: 1
        bezirkSlug:
          type: string
          minLength: 1
    BulkAddTeachersRequest:
      type: object
      required: [foodsharingIds, bezirkSlug]
      properties:
        foodsharingIds:
          type: array
          minItems: 1
          maxItems: 200
          items:
            type: string
        bezirkSlug:
          type: string
          minLength: 1
    BulkAddTeachersResponse:
      type: object
      required: [results, refreshQueued]
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/BulkAddTeacherResult'
        refreshQueued:
          type: integer
          description: Existing users whose data is refreshed from Foodsharing in the background
    BulkAddTeacherResult:
      type: object
      required: [foodsharingId, status]
      properties:
        foodsharingId:
          type: string
        status:
          type: string
          enum: [CREATED, GRANTED, ALREADY_TEACHER, FAILED]
        userId:
          type: string
          format: uuid
