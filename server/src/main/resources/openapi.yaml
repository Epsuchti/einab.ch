openapi: 3.0.3
info:
  title: Foodsharing EinAb API
  version: 1.0.0
servers:
  - url: /
tags:
  - name: public
  - name: auth
  - name: user
  - name: teacher
  - name: admin
  - name: survey
  - name: admin-import
  - name: support
  - name: infoNote
  - name: account
paths:
  /api/public/bezirke:
    get:
      tags: [public]
      operationId: getBezirke
      responses:
        '200':
          description: Active Bezirke
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BezirkListResponse'
  /api/public/foodsharing-status:
    get:
      tags: [public]
      operationId: getFoodsharingAvailability
      responses:
        '200':
          description: Whether foodsharing.at is reachable (login and approvals need it)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FoodsharingStatusResponse'
  /api/public/demo-login:
    get:
      tags: [public]
      operationId: getDemoLoginStatus
      description: Whether the one-tap demo accounts are available (test server only).
      responses:
        '200':
          description: Demo login availability
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DemoLoginStatusResponse'
  /api/public/bezirke/{bezirkSlug}/slots/available:
    get:
      tags: [public]
      operationId: getAvailableSlots
      parameters:
        - $ref: '#/components/parameters/BezirkSlug'
        - name: search
          in: query
          schema:
            type: string
        - name: category
          in: query
          schema:
            $ref: '#/components/schemas/EinAbCategory'
        - name: visitFairteiler
          in: query
          schema:
            type: boolean
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Available bookable slots
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvailableSlotListResponse'
  /api/public/notifications/unsubscribe:
    post:
      tags: [public]
      operationId: unsubscribeNotifications
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationUnsubscribeRequest'
      responses:
        '200':
          description: Subscription disabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationSubscriptionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/auth/bezirke/{bezirkSlug}/request-login:
    post:
      tags: [auth]
      operationId: requestLogin
      parameters:
        - $ref: '#/components/parameters/BezirkSlug'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Foodsharing message requested
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          description: Too many login requests for this account or IP
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/auth/demo-login/new-account:
    post:
      tags: [auth]
      operationId: createDemoAccount
      description: Creates a new demo account (test server only, no password) and signs it in, so every tester gets an own account. 404 elsewhere.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DemoAccountRequest'
      responses:
        '200':
          description: New demo account signed in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          description: Too many demo accounts created from this IP
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/auth/verify-token:
    post:
      tags: [auth]
      operationId: verifyLoginToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyTokenRequest'
      responses:
        '200':
          description: Authenticated session created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/auth/session:
    get:
      tags: [auth]
      operationId: getCurrentSession
      description: Current permissions and account flags of the logged-in user, so the client can refresh them without a new login.
      responses:
        '200':
          description: Current session state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionInfoResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/auth/privacy-consent:
    post:
      tags: [auth]
      operationId: acceptPrivacyConsent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PrivacyConsentRequest'
      responses:
        '200':
          description: Privacy consent accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/auth/bezirk-info/acknowledge:
    post:
      tags: [auth]
      operationId: acknowledgeBezirkInfo
      description: The logged-in user has read the info page of their home Bezirk (second onboarding step, after the privacy consent).
      responses:
        '200':
          description: Current session state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionInfoResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/user/bezirke/{bezirkSlug}/info:
    get:
      tags: [user]
      operationId: getBezirkInfo
      description: The Bezirk's info page (Markdown), shown as onboarding step and later from the help page and the menu.
      parameters:
        - $ref: '#/components/parameters/BezirkSlug'
        - name: language
          in: query
          description: Language code of the text (de, en, gws); falls back to German when the Bezirk has no text in this language.
          schema:
            type: string
            maxLength: 10
      responses:
        '200':
          description: Bezirk info
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BezirkInfoResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/user/bezirke/{bezirkSlug}/bookings:
    get:
      tags: [user]
      operationId: getMyBookings
      parameters:
        - $ref: '#/components/parameters/BezirkSlug'
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: User bookings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/user/bezirke/{bezirkSlug}/slots/{slotId}/book:
    post:
      tags: [user]
      operationId: bookSlot
      parameters:
        - $ref: '#/components/parameters/BezirkSlug'
        - $ref: '#/components/parameters/SlotId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookSlotRequest'
      responses:
        '200':
          description: Booking created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingDetailResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/user/bezirke/{bezirkSlug}/progress:
    get:
      tags: [user]
      operationId: getMyProgress
      parameters:
        - $ref: '#/components/parameters/BezirkSlug'
      responses:
        '200':
          description: Progress of the current user towards verification
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NewcomerProgressResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/user/notifications:
    get:
      tags: [user]
      operationId: getMyNotificationStatus
      summary: Whether the signed-in user receives notifications about new EinAbs
      responses:
        '200':
          description: Notification status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationStatusResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      tags: [user]
      operationId: unsubscribeMyNotifications
      responses:
        '204':
          description: Notifications switched off
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/user/bezirke/{bezirkSlug}/notifications:
    post:
      tags: [user]
      operationId: subscribeMyNotifications
      summary: Get notified about new EinAbs the signed-in user could book (unverified users only)
      parameters:
        - $ref: '#/components/parameters/BezirkSlug'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationSubscribeRequest'
      responses:
        '200':
          description: Subscription stored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationSubscriptionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/user/me:
    get:
      tags: [user]
      operationId: getMyProfile
      responses:
        '200':
          description: Current booking user profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingUserResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [user]
      operationId: updateMyProfile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMyProfileRequest'
      responses:
        '200':
          description: Updated current user profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingUserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/user/push-devices:
    put:
      tags: [user]
      operationId: registerMyPushDevice
      summary: Receive every message also as a push notification on this phone (store app only)
      description: Called by the app on every start while signed in and push is turned on. A token registered for another user moves to the signed-in user.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PushDeviceRequest'
      responses:
        '204':
          description: Device registered
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/user/push-devices/unregister:
    post:
      tags: [user]
      operationId: unregisterMyPushDevice
      summary: Stop push notifications on this phone (turned off in the app, or signing out)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PushDeviceUnregisterRequest'
      responses:
        '204':
          description: Device removed (or was not registered)
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/user/account:
    delete:
      tags: [account]
      operationId: deleteMyAccount
      summary: Delete the signed-in user's account (required by the App Store and Google Play)
      description: Removes name, phone number, email, sessions, push phones, notification subscription and the notes of the EinAb-Gebenden about the person, and releases future bookings. Past bookings stay anonymous. Refused while the person still has future EinAbs as EinAb-Geber:in or a connected Foodsharing automation account.
      responses:
        '204':
          description: Account deleted; the session is gone
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: Future EinAbs or a Foodsharing connection must be handled first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/public/account-deletion/request:
    post:
      tags: [account]
      operationId: requestAccountDeletion
      summary: Send a link to confirm deleting an account to its Foodsharing inbox (public deletion page)
      description: Answers the same whether or not an account exists for the Foodsharing ID. Limited per IP address and account.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountDeletionRequest'
      responses:
        '204':
          description: Link sent if the account exists
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/public/account-deletion/confirm:
    post:
      tags: [account]
      operationId: confirmAccountDeletion
      summary: Delete the account with the link from the Foodsharing message
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountDeletionConfirmRequest'
      responses:
        '204':
          description: Account deleted
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: Future EinAbs or a Foodsharing connection must be handled first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/public/support-requests:
    post:
      tags: [support]
      operationId: createSupportRequest
      summary: Send a question, problem or idea to the admins of the Bezirk
      description: Signed-in users are recorded automatically; without sign-in (e.g. login problems) contactFoodsharingId is required. The client adds its release, platform and the page it came from so admins can reproduce problems. The Bezirk admins get a Foodsharing message. Limited per IP address.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SupportRequestCreateRequest'
      responses:
        '201':
          description: Request stored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupportRequestResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          description: Too many support requests from this address
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/admin/support-requests:
    get:
      tags: [support]
      operationId: listSupportRequests
      summary: Support requests of all users, newest first
      parameters:
        - name: status
          in: query
          description: Only requests with this status; all when left out.
          schema:
            $ref: '#/components/schemas/SupportRequestStatus'
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Support requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupportRequestListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/admin/support-requests/{supportRequestId}/status:
    put:
      tags: [support]
      operationId: updateSupportRequestStatus
      summary: Mark a support request as done, or open it again
      parameters:
        - name: supportRequestId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SupportRequestStatusUpdateRequest'
      responses:
        '200':
          description: Updated request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupportRequestResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/public/info-notes:
    get:
      tags: [infoNote]
      operationId: getActiveInfoNotes
      summary: Info notes running right now
      description: Notes for the whole site, plus the notes of the given Bezirk. An unknown or disabled Bezirk only gets the site-wide notes. Dismissing a note is kept in the browser, not on the server.
      parameters:
        - name: bezirkSlug
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Active info notes, newest start first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InfoNoteListResponse'
  /api/admin/info-notes:
    get:
      tags: [infoNote]
      operationId: listAdminInfoNotes
      summary: All info notes, including scheduled and ended ones
      responses:
        '200':
          description: Info notes, latest end first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminInfoNoteListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [infoNote]
      operationId: createAdminInfoNote
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InfoNoteRequest'
      responses:
        '201':
          description: Info note created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminInfoNoteResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/admin/info-notes/{infoNoteId}:
    put:
      tags: [infoNote]
      operationId: updateAdminInfoNote
      parameters:
        - name: infoNoteId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InfoNoteRequest'
      responses:
        '200':
          description: Info note updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminInfoNoteResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [infoNote]
      operationId: deleteAdminInfoNote
      parameters:
        - name: infoNoteId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Info note deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/user/bezirke/{bezirkSlug}/bookings/{slotId}:
    delete:
      tags: [user]
      operationId: cancelMyBooking
      parameters:
        - $ref: '#/components/parameters/BezirkSlug'
        - $ref: '#/components/parameters/SlotId'
      responses:
        '204':
          description: Booking cancelled
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/user/bezirke/{bezirkSlug}/pickups:
    get:
      tags: [user]
      operationId: getMyPickups
      description: Foodsharing pickups of the current user, read from the automation's store pickup cache.
      parameters:
        - $ref: '#/components/parameters/BezirkSlug'
      responses:
        '200':
          description: Pickups of the current user grouped by store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyPickupListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/user/bezirke/{bezirkSlug}/pickups/extra-slot:
    post:
      tags: [user]
      operationId: addMyPickupExtraSlot
      description: Adds exactly one extra slot to a pickup where the current user is the first person.
      parameters:
        - $ref: '#/components/parameters/BezirkSlug'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddPickupExtraSlotRequest'
      responses:
        '200':
          description: Updated pickups of the current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyPickupListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/teacher/me:
    get:
      tags: [teacher]
      operationId: getTeacherMe
      responses:
        '200':
          description: Teacher profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeacherSelfResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      tags: [teacher]
      operationId: updateTeacherMe
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTeacherMeRequest'
      responses:
        '200':
          description: Updated teacher profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeacherSelfResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/teacher/private-info-templates:
    get:
      tags: [teacher]
      operationId: getTeacherPrivateInfoTemplates
      responses:
        '200':
          description: Private info templates belonging to the current teacher
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrivateInfoTemplateListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/teacher/bezirke:
    put:
      tags: [teacher]
      operationId: assignTeacherBezirk
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignTeacherBezirkRequest'
      responses:
        '200':
          description: Updated teacher profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeacherResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/teacher/bezirke/{bezirkSlug}/einabs:
    get:
      tags: [teacher]
      operationId: getTeacherEinAbs
      parameters:
        - $ref: '#/components/parameters/BezirkSlug'
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 20
        - name: pastOnly
          in: query
          description: Show only EinAbs whose start date has passed
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Teacher EinAbs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeacherEinAbListResponse'
    post:
      tags: [teacher]
      operationId: createTeacherEinAb
      parameters:
        - $ref: '#/components/parameters/BezirkSlug'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertEinAbRequest'
      responses:
        '201':
          description: EinAb created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeacherEinAbResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
