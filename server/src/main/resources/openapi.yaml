          type: boolean
        gapRuleEnabled:
          type: boolean
        minimumGapDays:
          type: integer
          format: int32
          minimum: 0
        cleaningRuleEnabled:
          type: boolean
        experienceRuleEnabled:
          type: boolean
        publicHolidayRuleEnabled:
          type: boolean
        linkedStores:
          type: array
          description: Linked store rules (at most 2). Omit to keep the saved links unchanged; an empty list removes them.
          items:
            $ref: '#/components/schemas/FoodsharingStoreAutomationLinkedStore'
        gapStores:
          type: array
          maxItems: 9
          description: Other stores sharing a gap with this store. The list and gapStoresMinimumDays are shared by all these stores. An empty list takes this store out of it, so always send the current list.
          items:
            $ref: '#/components/schemas/FoodsharingManagedStore'
        gapStoresMinimumDays:
          type: integer
          format: int32
          nullable: true
          description: Minimum gap between pickups in different stores of gapStores, at least 1 with a list. Pickups within one store follow minimumGapDays.
    FoodsharingStoreAutomationLinkedStore:
      type: object
      description: Every pickup in this store also requires its own pickup in one of the linked stores.
      required: [linkedStores, bidirectional, windowMode, windowDaysBefore, windowDaysAfter, graceMinutes]
      properties:
        linkedStores:
          type: array
          minItems: 1
          maxItems: 5
          description: Any of these stores satisfies the rule. Each pickup here needs a separate pickup in one of them.
          items:
            $ref: '#/components/schemas/FoodsharingManagedStore'
        bidirectional:
          type: boolean
          description: The rule also applies to pickups in the linked stores (each requiring a pickup in this store).
        windowMode:
          type: string
          enum: [SAME_DAY, LAST_DAYS]
          description: SAME_DAY requires the linked pickup on the same calendar day; LAST_DAYS within windowDaysBefore days before and windowDaysAfter days after the pickup.
        windowDaysBefore:
          type: integer
          format: int32
          minimum: 0
          maximum: 120
        windowDaysAfter:
          type: integer
          format: int32
          minimum: 0
          maximum: 120
        graceMinutes:
          type: integer
          format: int32
          minimum: 20
          description: Minutes after signing up the person has to book the linked store before being removed from the slot.
        message:
          type: string
          nullable: true
          description: Message for the removed person. Empty uses the default text. Variables are {{name}}, {{storeName}}, {{linkedStoreName}}, {{pickupDate}}, {{requirement}} and {{graceMinutes}}.
        exemptions:
          type: array
          maxItems: 200
          description: Members this link does not apply to (in both directions of a bidirectional link). Omitted or empty means nobody is exempt.
          items:
            $ref: '#/components/schemas/FoodsharingLinkedStoreExemption'
    FoodsharingLinkedStoreExemption:
      type: object
      required: [foodsharingId, reason]
      properties:
        foodsharingId:
          type: string
          description: Foodsharing user id (digits only).
        reason:
          type: string
          maxLength: 1000
          description: Why this member is exempt.
    FoodsharingStoreAutomationIncomingLinkedStore:
      type: object
      description: A link saved on another store that points at this store. Only a bidirectional one also applies to this store.
      required: [sourceStoreId, sourceStoreName, bidirectional, windowMode, windowDaysBefore, windowDaysAfter, graceMinutes]
      properties:
