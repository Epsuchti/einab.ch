spring.application.name=foodsharing-einab-tabelle-local
# Real credentials for local runs live in server/local-secrets.properties (gitignored, see local-secrets.example.properties).
spring.config.import=optional:file:./local-secrets.properties
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false
app.frontend.base-url=http://localhost:4200
app.mail.from=noreply@localhost
spring.mail.host=localhost
spring.mail.port=2525
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

app.foodsharing.token-encryption-key=${FOODSHARING_TOKEN_ENCRYPTION_KEY:}

app.foodsharing.admin-user=${FOODSHARING_ADMIN_USER:}
app.foodsharing.admin-password=${FOODSHARING_ADMIN_PASSWORD:}
app.foodsharing.send-messages=false

# Local mail goes to the fake SMTP server and Foodsharing messages are suppressed above.
app.outbound.restricted=false

# Demo login on by default locally: type Foodsharing ID 1308 on the login page to get a new demo account.
app.auth.demo-login.enabled=${DEMO_LOGIN_ENABLED:true}
