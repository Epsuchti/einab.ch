<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Foodsharing EinAb</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <meta name="theme-color" content="#25834a">
  <!-- Boot skeleton: inline so it paints before the Angular bundle and global styles load. It mirrors the app shell
       (header, a card with list rows) and is replaced as soon as the app starts. -->
  <style>
    html { background: #f5f8f4; }
    .boot { position: fixed; inset: 0; animation: boot-in 200ms ease 150ms both; }
    .boot__header { display: flex; align-items: center; gap: 0.6rem; height: 3.6rem; padding: 0 1.25rem; border-bottom: 1px solid #c7d8c9; background: #fff; }
    .boot__page { display: grid; gap: 0.75rem; width: min(100%, 60rem); margin: 0 auto; padding: 1.25rem; box-sizing: border-box; }
    .boot__card { display: grid; gap: 0.75rem; padding: 1.25rem; border: 1px solid #dce7dd; border-radius: 0.875rem; background: #fff; }
    .boot__row { display: flex; align-items: center; gap: 0.75rem; padding: 0.75rem 0; border-top: 1px solid #eaf0eb; }
    .boot__lines { display: grid; flex: 1 1 auto; gap: 0.4rem; }
    .boot__s { display: block; height: 0.85rem; border-radius: 0.375rem; background: linear-gradient(100deg, #e5ede6 38%, #f4f8f4 50%, #e5ede6 62%); background-size: 320% 100%; animation: boot-shimmer 1.6s ease-in-out infinite; }
    .boot__s--mark { width: 2.1rem; height: 2.1rem; border-radius: 50%; }
    @keyframes boot-shimmer { from { background-position: 100% 0; } to { background-position: 0 0; } }
    @keyframes boot-in { from { opacity: 0; } to { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .boot__s { animation: none; } }
  </style>
</head>
<body>
  <app-root>
    <div class="boot" role="status" aria-label="Loading">
      <div class="boot__header"><span class="boot__s boot__s--mark"></span><span class="boot__s" style="width: 8rem"></span></div>
      <div class="boot__page">
        <div class="boot__card">
          <span class="boot__s" style="width: 12rem; height: 1.3rem"></span>
          <span class="boot__s" style="width: 70%"></span>
          <div class="boot__row"><span class="boot__s" style="width: 2.6rem"></span><span class="boot__lines"><span class="boot__s" style="width: 45%"></span><span class="boot__s" style="width: 65%; height: 0.7rem"></span></span></div>
          <div class="boot__row"><span class="boot__s" style="width: 2.6rem"></span><span class="boot__lines"><span class="boot__s" style="width: 58%"></span><span class="boot__s" style="width: 50%; height: 0.7rem"></span></span></div>
          <div class="boot__row"><span class="boot__s" style="width: 2.6rem"></span><span class="boot__lines"><span class="boot__s" style="width: 38%"></span><span class="boot__s" style="width: 60%; height: 0.7rem"></span></span></div>
          <div class="boot__row"><span class="boot__s" style="width: 2.6rem"></span><span class="boot__lines"><span class="boot__s" style="width: 50%"></span><span class="boot__s" style="width: 42%; height: 0.7rem"></span></span></div>
        </div>
      </div>
    </div>
  </app-root>
</body>
</html>
