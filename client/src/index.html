<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Foodsharing EinAb</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <meta name="theme-color" content="#25834a">
  <!-- Boot spinner: inline so it paints before the Angular bundle and global styles load. -->
  <style>
    html { background: #f5f8f4; }
    .boot-loader {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: boot-loader-fade-in 200ms ease 150ms both;
    }
    .boot-loader__spinner {
      width: 2.5rem;
      height: 2.5rem;
      box-sizing: border-box;
      border: 4px solid #e3f3e6;
      border-top-color: #25834a;
      border-radius: 50%;
      animation: boot-loader-spin 0.8s linear infinite;
    }
    @keyframes boot-loader-spin { to { transform: rotate(360deg); } }
    @keyframes boot-loader-fade-in { from { opacity: 0; } to { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      .boot-loader__spinner { animation-duration: 2.4s; }
    }
  </style>
</head>
<body>
  <app-root>
    <div class="boot-loader" role="status" aria-label="Loading">
      <div class="boot-loader__spinner"></div>
    </div>
  </app-root>
</body>
</html>
