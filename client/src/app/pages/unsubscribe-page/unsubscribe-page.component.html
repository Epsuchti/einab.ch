<section class="page-shell page-shell--narrow page-stack">
  <p-card class="page-card--flat">
    <ng-template pTemplate="title"><i class="pi pi-bell-slash title-icon" aria-hidden="true"></i>{{ title() }}</ng-template>
    @if (loading()) {
      <div class="loading-box">
        <p-progressSpinner strokeWidth="4"></p-progressSpinner>
      </div>
    } @else {
      <div class="empty-state">
        <i class="pi" [ngClass]="succeeded() ? 'pi-check-circle' : 'pi-exclamation-circle'" aria-hidden="true"></i>
        <p>{{ message() }}</p>
        @if (succeeded()) {
          <p>{{ i18n.t('unsubscribe.resubscribeHint') }}</p>
        }
        <a pButton icon="pi pi-calendar" [label]="i18n.t('unsubscribe.toSlots')" [routerLink]="['..']" [relativeTo]="route"></a>
      </div>
    }
  </p-card>
</section>
