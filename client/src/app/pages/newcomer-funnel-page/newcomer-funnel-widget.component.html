@if (funnel(); as f) {
  <p-card class="funnel-widget">
    <ng-template pTemplate="title">
      <div class="funnel-widget__header">
        <div class="funnel-widget__title">
          <i class="pi pi-users" aria-hidden="true"></i>
          <span>{{ i18n.t('funnel.widgetTitle') }}</span>
        </div>
        <a
          pButton
          size="small"
          severity="secondary"
          icon="pi pi-arrow-right"
          iconPos="right"
          [routerLink]="bezirkContext.route('teacher', 'newcomers')"
          [label]="i18n.t('funnel.showMore')"
        ></a>
      </div>
    </ng-template>
    <p class="funnel-widget__summary">
      {{ i18n.t(f.inTrainingUsers === 1 ? 'funnel.widgetSummaryOne' : 'funnel.widgetSummary').replace('{inTraining}', '' + f.inTrainingUsers).replace('{stalled}', '' + f.stalledUsers) }}
    </p>
    <app-newcomer-funnel-stepper [steps]="f.steps" [compact]="true"></app-newcomer-funnel-stepper>
    <div class="funnel-widget__needs">
      <app-newcomer-needs [funnel]="f" [maxActions]="3"></app-newcomer-needs>
    </div>
  </p-card>
} @else if (loading()) {
  <p-card class="funnel-widget">
    <app-loading-indicator [compact]="true" />
  </p-card>
}
