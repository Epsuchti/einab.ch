<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>EinAb</title>
  <style>
    html, body { margin: 0; height: 100%; background: #f5f8f4; color: #1f2a22; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    main { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; box-sizing: border-box; text-align: center; gap: 12px; }
    h1 { font-size: 1.25rem; margin: 0; }
    p { margin: 0; max-width: 22rem; line-height: 1.45; color: #4a5a4f; }
    button { margin-top: 12px; border: 0; border-radius: 10px; padding: 12px 22px; font-size: 1rem; font-weight: 600; color: #fff; background: #25834a; }
  </style>
</head>
<body>
  <main>
    <h1>Keine Verbindung</h1>
    <p>Bitte prüfe deine Internetverbindung und versuche es noch einmal.</p>
    <p lang="en">No connection. Please check your internet connection.</p>
    <button type="button" onclick="history.length > 1 ? history.back() : location.reload()">Neu laden / Retry</button>
  </main>
</body>
</html>
